# Local stack: docker compose up --build
#   API       http://localhost:8000 (docs at /docs)
#   Worker    http://localhost:8081/healthz
#   Kafka UI  http://localhost:8080
x-app: &app
  build: .
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/transactions
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    PROCESSING_DELAY_SECONDS: ${PROCESSING_DELAY_SECONDS:-30}
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transactions
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transactions"]
      interval: 2s
      retries: 30

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      retries: 30

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka: { condition: service_healthy }

  # One-shot: create topics and run migrations before the services start.
  init:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "python scripts/create_topics.py && alembic upgrade head"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  api:
    <<: *app
    ports: ["8000:8000"]
    depends_on:
      init: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["python", "-m", "txn_service.worker.main"]
    environment:
      <<: *app-env
      WORKER_HTTP_PORT: 8081
    ports: ["8081:8081"]
    depends_on:
      init: { condition: service_completed_successfully }
