# Render Blueprint: one image for two always-on services (API + worker), plus the optional demo
# dashboard as a free static site on Render's CDN.
# Secrets are `sync: false` (entered in Render) or generated by Render; none live in git.
services:
  - type: web
    name: txn-api
    runtime: docker
    plan: starter            # always on: no cold starts, so the 500 ms webhook SLA holds
    region: singapore        # same AWS region as Neon and Confluent (ap-southeast-1)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - fromGroup: txn-shared
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS  # cluster endpoint: set in Render, not kept in the repo
        sync: false
      - key: KAFKA_API_KEY
        sync: false
      - key: KAFKA_API_SECRET
        sync: false
      - key: WEBHOOK_SECRET   # optional: leave empty to disable signature verification
        sync: false
      - key: ADMIN_API_KEY    # protects the dashboard's admin endpoints; read it in the Render dashboard
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS  # the dashboard's public URL (https://...): set in Render, not kept in the repo
        sync: false

  - type: worker
    name: txn-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m txn_service.worker.main
    autoDeploy: true
    envVars:
      - fromGroup: txn-shared
      - key: DATABASE_URL
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_API_KEY
        sync: false
      - key: KAFKA_API_SECRET
        sync: false

  - type: web
    name: txn-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE    # the API's public URL (https://...), baked in at build time: set in Render
        sync: false
    routes:
      - type: rewrite         # single-page app: unknown paths serve index.html
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*       # content-hashed file names: safe to cache forever
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://*.onrender.com; img-src 'self' data:; style-src 'self'; frame-ancestors 'none'; base-uri 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer

envVarGroups:
  - name: txn-shared
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: PLAIN
      - key: KAFKA_TOPIC_REPLICATION_FACTOR
        value: "3"
      - key: PROCESSING_DELAY_SECONDS
        value: "30"
