<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920" width="1100" height="920" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Transaction Event Service architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d64545"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background (keeps the diagram readable on dark themes too) -->
  <rect width="1100" height="920" fill="#ffffff"/>

  <!-- Title -->
  <text x="550" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Transaction Event Service</text>
  <text x="550" y="66" text-anchor="middle" font-size="13" fill="#64748b">Acknowledge fast · process reliably · exactly-once effects</text>

  <!-- Payment processor -->
  <g filter="url(#shadow)">
    <rect x="40" y="115" width="200" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  </g>
  <text x="140" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Payment processor</text>
  <text x="140" y="174" text-anchor="middle" font-size="12" fill="#475569">e.g. RazorPay</text>

  <!-- API service -->
  <g filter="url(#shadow)">
    <rect x="330" y="90" width="520" height="175" rx="10" fill="#eaf2fe" stroke="#2f6fd6" stroke-width="1.5"/>
  </g>
  <text x="350" y="118" font-size="16" font-weight="700" fill="#1e40af">API service</text>
  <text x="830" y="118" text-anchor="end" font-size="12" fill="#2f6fd6">FastAPI · Railway</text>
  <line x1="350" y1="128" x2="830" y2="128" stroke="#2f6fd6" stroke-opacity="0.3"/>
  <g font-size="13" fill="#1e293b">
    <text x="350" y="152">1. Verify HMAC signature (optional)</text>
    <text x="350" y="177">2. Validate payload: exact Decimal amount, ISO-4217 currency</text>
    <text x="350" y="202">3. Publish to Kafka: key=transaction_id, acks=all, idempotent</text>
    <text x="350" y="227">4. Return 202 Accepted (no processing on the request path)</text>
  </g>
  <text x="350" y="252" font-size="11.5" fill="#2f6fd6">Broker ack bounded to 400 ms → 503 + Retry-After if unavailable</text>

  <!-- Processor -> API -->
  <line x1="240" y1="145" x2="326" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285" y="137" text-anchor="middle" font-size="11.5" fill="#334155">POST webhook</text>
  <!-- API -> Processor (response) -->
  <line x1="330" y1="180" x2="244" y2="180" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="285" y="197" text-anchor="middle" font-size="11.5" fill="#334155">202 / 503</text>

  <!-- API -> Kafka -->
  <line x1="590" y1="265" x2="590" y2="321" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="602" y="298" font-size="11.5" fill="#334155">produce (one durable write)</text>

  <!-- Kafka topic -->
  <g filter="url(#shadow)">
    <rect x="330" y="325" width="520" height="115" rx="10" fill="#fff6e5" stroke="#d98a00" stroke-width="1.5"/>
  </g>
  <text x="350" y="353" font-size="16" font-weight="700" fill="#92400e">Kafka topic · transactions.received</text>
  <text x="830" y="353" text-anchor="end" font-size="12" fill="#b45309">Confluent Cloud</text>
  <g font-size="11" fill="#92400e" text-anchor="middle">
    <rect x="350" y="370" width="72" height="34" rx="5" fill="#ffe7b8" stroke="#d98a00"/>
    <text x="386" y="392">P0</text>
    <rect x="431" y="370" width="72" height="34" rx="5" fill="#ffe7b8" stroke="#d98a00"/>
    <text x="467" y="392">P1</text>
    <rect x="512" y="370" width="72" height="34" rx="5" fill="#ffe7b8" stroke="#d98a00"/>
    <text x="548" y="392">P2</text>
    <rect x="593" y="370" width="72" height="34" rx="5" fill="#ffe7b8" stroke="#d98a00"/>
    <text x="629" y="392">P3</text>
    <rect x="674" y="370" width="72" height="34" rx="5" fill="#ffe7b8" stroke="#d98a00"/>
    <text x="710" y="392">P4</text>
    <rect x="755" y="370" width="72" height="34" rx="5" fill="#ffe7b8" stroke="#d98a00"/>
    <text x="791" y="392">P5</text>
  </g>
  <text x="350" y="426" font-size="11.5" fill="#b45309">Keyed by transaction_id: duplicates land on the same partition, handled in order</text>

  <!-- Kafka -> Consumer -->
  <line x1="590" y1="440" x2="590" y2="496" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="602" y="473" font-size="11.5" fill="#334155">consume (manual offset commits)</text>

  <!-- Consumer service -->
  <g filter="url(#shadow)">
    <rect x="330" y="500" width="520" height="200" rx="10" fill="#e9f7ee" stroke="#2e9e5b" stroke-width="1.5"/>
  </g>
  <text x="350" y="528" font-size="16" font-weight="700" fill="#166534">Consumer service</text>
  <text x="830" y="528" text-anchor="end" font-size="12" fill="#2e9e5b">separate process · Railway</text>
  <line x1="350" y1="538" x2="830" y2="538" stroke="#2e9e5b" stroke-opacity="0.3"/>
  <g font-size="13" fill="#1e293b">
    <text x="350" y="562" font-weight="600">Per partition, in order:</text>
    <text x="350" y="587"><tspan font-weight="700" fill="#166534">ingest</tspan>   → INSERT … ON CONFLICT DO NOTHING (row = PROCESSING)</text>
    <text x="350" y="612"><tspan font-weight="700" fill="#166534">complete</tspan> → wait until received_at + 30s → UPDATE → PROCESSED</text>
    <text x="350" y="637">Commit offset only after the DB commit (crash = redelivery)</text>
    <text x="350" y="662">Failures → 3 attempts with backoff → DLQ (row = FAILED)</text>
  </g>
  <text x="350" y="687" font-size="11.5" fill="#2e9e5b">Backpressure pauses busy partitions · graceful SIGTERM shutdown</text>

  <!-- Consumer -> DLQ -->
  <line x1="850" y1="600" x2="906" y2="600" stroke="#d64545" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- DLQ -->
  <g filter="url(#shadow)">
    <rect x="910" y="555" width="160" height="90" rx="10" fill="#fdecec" stroke="#d64545" stroke-width="1.5"/>
  </g>
  <text x="990" y="588" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">transactions.dlq</text>
  <text x="990" y="609" text-anchor="middle" font-size="11.5" fill="#b91c1c">poison / exhausted</text>
  <text x="990" y="626" text-anchor="middle" font-size="11.5" fill="#b91c1c">reason in headers</text>

  <!-- Consumer -> Postgres -->
  <line x1="590" y1="700" x2="590" y2="756" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="602" y="733" font-size="11.5" fill="#334155">idempotent INSERT / conditional UPDATE</text>

  <!-- PostgreSQL cylinder -->
  <g filter="url(#shadow)">
    <path d="M430,775 a160,18 0 0,1 320,0 v75 a160,18 0 0,1 -320,0 z" fill="#f0ebfe" stroke="#6b4fd6" stroke-width="1.5"/>
  </g>
  <ellipse cx="590" cy="775" rx="160" ry="18" fill="#e2d9fc" stroke="#6b4fd6" stroke-width="1.5"/>
  <text x="590" y="818" text-anchor="middle" font-size="16" font-weight="700" fill="#4c1d95">PostgreSQL · source of truth</text>
  <text x="590" y="840" text-anchor="middle" font-size="12" fill="#6b4fd6">Neon · PK transaction_id · NUMERIC(18,4)</text>

  <!-- API -> Postgres read path (GET) -->
  <path d="M330,240 H190 V812 H426" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="178" y="520" text-anchor="middle" font-size="11.5" fill="#334155" transform="rotate(-90 178 520)">GET /v1/transactions/{id}: read status</text>

  <!-- Legend -->
  <g font-size="11.5" fill="#475569">
    <line x1="40" y1="890" x2="80" y2="890" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="88" y="894">write / event path</text>
    <line x1="220" y1="890" x2="260" y2="890" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="268" y="894">response / read path</text>
    <line x1="420" y1="890" x2="460" y2="890" stroke="#d64545" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="468" y="894">failure path</text>
    <text x="1060" y="894" text-anchor="end">At-least-once delivery + idempotent consumer = effectively exactly-once</text>
  </g>
</svg>
